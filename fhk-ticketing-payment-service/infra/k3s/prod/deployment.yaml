apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhk-ticketing-payment-service
  namespace: prod
  labels:
    app: fhk-ticketing-payment-service
    env: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fhk-ticketing-payment-service
  template:
    metadata:
      labels:
        app: fhk-ticketing-payment-service
        env: prod
    spec:
      containers:
        - name: fhk-ticketing-payment-service
          image: juno6800/fhk-ticketing-payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            # 필수(기본값 없는 것들만)
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fhk-security-db
                  key: username
            - name: DB_PW
              valueFrom:
                secretKeyRef:
                  name: fhk-security-db
                  key: password
            - name: REDIS_PW
              valueFrom:
                secretKeyRef:
                  name: fhk-redis
                  key: password

            # 추후 환경별 다른 환경변수 필요한경우 풀고 수정
            - name: SERVER_PORT
              value: "8080"
            - name: SQL_INCREMENT_SIZE
              value: "50"
            - name: DB_URL
              value: "jdbc:mariadb://192.168.45.210:3306/fhk_ticketing_payment_db_live"
            # - name: REDIS_HOST
            #   value: "192.168.45.211"
            # - name: REDIS_PORT
            #   value: "6379"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"